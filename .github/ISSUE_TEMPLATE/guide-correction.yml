name: Guide correction or missing route
description: Report an inaccurate step, missing collectible, or quest cutoff.
title: "Guide correction: "
labels: ["guide-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the beta. Our guides are source-researched, not independently game-tested. Please avoid posting private information.
  - type: input
    id: region
    attributes:
      label: Region and item number
      placeholder: "Weeping Creek Valley — #27"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What did the guide say?
      description: Quote only the relevant short step or provide its URL.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened in the game?
      description: Include your starting location, game version, and expected result if known.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (optional)
      description: Link to original gameplay captures or other sources you have permission to share.
    validations:
      required: false
