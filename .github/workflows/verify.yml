name: V2 quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run test:build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (bounded)
        run: timeout --signal=SIGTERM 180s npm run test:browser
      - name: Attempt live Cloudflare smoke check (non-blocking)
        run: node scripts/live-smoke.mjs
        continue-on-error: true
